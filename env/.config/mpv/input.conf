# Audio
UP    add volume 2
DOWN  add volume -2
WHEEL_UP      add volume 2
WHEEL_DOWN    add volume -2
m     cycle mute

# Seeking
RIGHT seek  5
LEFT  seek -5
Shift+RIGHT seek  30
Shift+LEFT  seek -30

# Quality/Info
i     script-binding stats/display-stats-toggle # Check GPU load and dropped frames
`     script-binding console/enable             # Open mpv console
d     cycle deband                              # Toggle debanding
f     cycle fullscreen

# Media Keys
XF86AudioPlay cycle pause
XF86AudioPause cycle pause
